defaults:
  - source: camera
  - detector: yolo26s
  - tracker: ocsort
  - motion: static_camera
  - awareness: temporal
  - output: default
  - _self_

runtime:
  device: auto
  maximum_frames: null
  log_level: INFO

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
