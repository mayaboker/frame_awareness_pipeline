[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-awareness-pipeline"
version = "1.0.0"
description = "Production camera awareness with YOLO26s, OC-SORT, and temporal decisions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "hydra-core==1.3.5",
  "lap==0.5.13",
  "numpy==2.2.6",
  "opencv-python==5.0.0.93",
  "torch==2.11.0",
  "ultralytics==8.4.118",
]

[project.optional-dependencies]
onnx = ["onnxruntime-gpu>=1.20,<2"]
dev = ["ruff>=0.9"]

[project.scripts]
frame-awareness = "frame_awareness.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
include = ["frame_awareness*"]

[tool.setuptools.data-files]
"share/frame_awareness/configs" = ["configs/config.yaml"]
"share/frame_awareness/configs/source" = ["configs/source/*.yaml"]
"share/frame_awareness/configs/detector" = ["configs/detector/*.yaml"]
"share/frame_awareness/configs/tracker" = ["configs/tracker/*.yaml"]
"share/frame_awareness/configs/motion" = ["configs/motion/*.yaml"]
"share/frame_awareness/configs/awareness" = ["configs/awareness/*.yaml"]
"share/frame_awareness/configs/output" = ["configs/output/*.yaml"]
"share/frame_awareness/models" = ["src/models/*.pt", "src/models/*.onnx"]

[tool.ruff]
line-length = 100
