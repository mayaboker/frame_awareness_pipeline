[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-awareness-pipeline"
version = "1.0.0"
description = "Production camera awareness with YOLO26s, OC-SORT, and temporal decisions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "hydra-core>=1.3,<2",
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8,<5",
  "torch>=2.0,<3",
  "ultralytics>=8.4.55,<9",
]

[project.optional-dependencies]
onnx = ["onnxruntime-gpu>=1.20,<2"]
dev = ["ruff>=0.9"]

[project.scripts]
frame-awareness = "frame_awareness.runner:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
include = ["frame_awareness*"]

[tool.ruff]
line-length = 100
